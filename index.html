<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirsten &amp; Kurtis — Save the Date</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #3a2350;
      padding: 1rem;
      font-family: Georgia, 'Palatino Linotype', Palatino, 'Book Antiqua', serif;
    }

    .card {
      background: #5d3b7d;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      position: relative;
    }

    .card-border {
      border: 1.5px solid #fff15c;
      padding: 16px;
      position: relative;
    }

    .card-inner {
      border: 0.5px solid #b789be;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .save-the-date {
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      color: #fff15c;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      text-align: center;
      font-style: normal;
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .rule {
      width: 100%;
      height: 1.5px;
      background: #fff15c;
      margin: 0.75rem 0;
    }

    .names {
      text-align: center;
      margin: 1rem 0;
    }

    .names .name {
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-style: italic;
      color: #faf8f5;
      line-height: 1.15;
      font-weight: 400;
    }

    .names .ampersand {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-style: italic;
      color: #b789be;
      line-height: 1.8;
      font-weight: 400;
    }

    .subtitle {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-style: italic;
      color: #b789be;
      letter-spacing: 0.15em;
      text-align: center;
      margin: 0.5rem 0 1rem;
      font-weight: 400;
    }

    .photos {
      display: flex;
      gap: clamp(4px, 1.5vw, 8px);
      width: 100%;
      margin: 0.5rem 0;
    }

    .photos img {
      flex: 1;
      width: 0;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
    }

    .date-section {
      text-align: center;
      margin: 1rem 0 0.25rem;
    }

    .date-text {
      font-size: clamp(1.2rem, 4vw, 1.75rem);
      color: #fff15c;
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.03em;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin: 0.6rem 0;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b789be;
      display: block;
    }

    .location {
      font-size: clamp(0.6rem, 1.8vw, 0.75rem);
      color: #fff15c;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      text-align: center;
      font-weight: 400;
      font-style: normal;
      margin-bottom: 1rem;
    }

    .footer-text {
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-style: italic;
      color: #b789be;
      letter-spacing: 0.15em;
      text-align: center;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-border">
      <div class="card-inner">

        <p class="save-the-date">Save the Date</p>

        <div class="rule"></div>

        <div class="names">
          <div class="name">Kirsten</div>
          <div class="ampersand">&amp;</div>
          <div class="name">Kurtis</div>
        </div>

        <p class="subtitle">are getting married</p>

        <div class="photos">
          <img src="engagement-1-square-2.jpg" alt="Kirsten and Kurtis">
          <img src="IMG_4053 (1).jpeg" alt="Kirsten and Kurtis">
          <img src="IMG_4251 (1).jpeg" alt="Kirsten and Kurtis">
        </div>

        <div class="rule"></div>

        <div class="date-section">
          <p class="date-text">October 3, 2026</p>
        </div>

        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <p class="location">Calgary, Alberta</p>

        <p class="footer-text">formal invitation to follow</p>

      </div>
    </div>
  </div>
</body>
</html>
